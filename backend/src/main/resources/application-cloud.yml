spring:
  main:
    lazy-initialization: true
  datasource:
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

app:
  database:
    async-initialization: true
