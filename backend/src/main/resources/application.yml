server:
  port: ${PORT:4000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:flowboard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:flowboard}
    password: ${DB_PASSWORD:flowboard_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: flowboard:session
  jackson:
    default-property-inclusion: non_null
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        name: FLOWBOARD_SESSION
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    registration-enabled: ${REGISTRATION_ENABLED:true}

